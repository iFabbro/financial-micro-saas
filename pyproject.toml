[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-micro-saas"
version = "0.1.0"
description = "Financial Micro-SaaS MCP SQLite Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19.0",
    "python-dotenv",
    "PyPortfolioOpt>=1.5,<2.0",
    "cvxpy>=1.3",
    "numpy>=1.20",
    "pandas>=2.0",
    "pytest",
    "pytest-asyncio",
    "streamlit>=1.30.0",
]

[project.scripts]
financial-mcp-server = "src.mcp_server:main"
financial-mcp-client = "src.client:main"
financial-mcp-report = "src.report:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
